<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="The problem: demo works but ships with open database, leaked keys and no backups. The solution: evidence-backed review and verified fixes.">
  <rect width="1200" height="420" rx="20" fill="#0f172a"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <text x="300" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#fb7185">The problem</text>
    <text x="900" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#34d399">What geeno-prodready does</text>
    <rect x="40" y="76" width="520" height="300" rx="16" fill="#1e293b" stroke="#fb7185" stroke-opacity=".5"/>
    <rect x="640" y="76" width="520" height="300" rx="16" fill="#1e293b" stroke="#34d399" stroke-opacity=".5"/>
    <g font-size="18" fill="#e2e8f0">
      <text x="70" y="124">The demo works, so it ships. But:</text>
      <text x="70" y="166" fill="#fda4af">&#10007;  any visitor can read the whole database</text>
      <text x="70" y="202" fill="#fda4af">&#10007;  an AI or admin key sits in the browser code</text>
      <text x="70" y="238" fill="#fda4af">&#10007;  a page is "protected" only by hiding a button</text>
      <text x="70" y="274" fill="#fda4af">&#10007;  the checkout trusts the price from the browser</text>
      <text x="70" y="310" fill="#fda4af">&#10007;  no backups, no error tracking, no rollback</text>
      <text x="70" y="350" font-size="15" fill="#94a3b8">Builders are not security engineers. Generic advice does not help.</text>
    </g>
    <g font-size="18" fill="#e2e8f0">
      <text x="670" y="124">A structured pre-launch review:</text>
      <text x="670" y="166" fill="#6ee7b7">&#10003;  evidence for every finding: file, line, snippet</text>
      <text x="670" y="202" fill="#6ee7b7">&#10003;  stack-aware: Supabase, Firebase, Next.js, Stripe</text>
      <text x="670" y="238" fill="#6ee7b7">&#10003;  plain words first, technical detail second</text>
      <text x="670" y="274" fill="#6ee7b7">&#10003;  fixes on a branch, re-checked by the scanner</text>
      <text x="670" y="310" fill="#6ee7b7">&#10003;  a launch gate for what only you can do</text>
      <text x="670" y="350" font-size="15" fill="#94a3b8">Runs on your machine. Never prints a secret.</text>
    </g>
    <path d="M572 226 H628" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
</svg>
