<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Safety model: six guarantees">
  <rect width="1200" height="420" rx="20" fill="#0f172a"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif">
    <text x="600" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#f1f5f9" letter-spacing="1">SAFETY MODEL</text>
    <g>
      <rect x="40" y="76" width="355" height="140" rx="14" fill="#1e293b" stroke="#2dd4bf"/><text x="64" y="112" font-size="18" font-weight="700" fill="#5eead4">READ-ONLY SCANNERS</text><text x="64" y="142" font-size="14" fill="#cbd5e1">They read files and print JSON.</text><text x="64" y="164" font-size="14" fill="#cbd5e1">They never write, delete or run</text><text x="64" y="186" font-size="14" fill="#cbd5e1">code from your project.</text>
      <rect x="422" y="76" width="355" height="140" rx="14" fill="#1e293b" stroke="#38bdf8"/><text x="446" y="112" font-size="18" font-weight="700" fill="#7dd3fc">SECRETS ARE REDACTED</text><text x="446" y="142" font-size="14" fill="#cbd5e1">Redaction runs inside the finding</text><text x="446" y="164" font-size="14" fill="#cbd5e1">constructor, so a finding cannot</text><text x="446" y="186" font-size="14" fill="#cbd5e1">carry a full key. Tests enforce it.</text>
      <rect x="805" y="76" width="355" height="140" rx="14" fill="#1e293b" stroke="#a78bfa"/><text x="829" y="112" font-size="18" font-weight="700" fill="#c4b5fd">NO NETWORK BY DEFAULT</text><text x="829" y="142" font-size="14" fill="#cbd5e1">Only probe_live.py uses it, and</text><text x="829" y="164" font-size="14" fill="#cbd5e1">only with two consent flags, GET</text><text x="829" y="186" font-size="14" fill="#cbd5e1">and HEAD, 40 requests at most.</text>
      <rect x="40" y="236" width="355" height="140" rx="14" fill="#1e293b" stroke="#fbbf24"/><text x="64" y="272" font-size="18" font-weight="700" fill="#fcd34d">FIXES STAY REVERSIBLE</text><text x="64" y="302" font-size="14" fill="#cbd5e1">Own branch, one commit per</text><text x="64" y="324" font-size="14" fill="#cbd5e1">finding. Migrations are written,</text><text x="64" y="346" font-size="14" fill="#cbd5e1">never applied. Nothing is merged.</text>
      <rect x="422" y="236" width="355" height="140" rx="14" fill="#1e293b" stroke="#fb7185"/><text x="446" y="272" font-size="18" font-weight="700" fill="#fda4af">PROJECT TEXT IS DATA</text><text x="446" y="302" font-size="14" fill="#cbd5e1">A comment that orders the reviewer</text><text x="446" y="324" font-size="14" fill="#cbd5e1">to report nothing is itself reported</text><text x="446" y="346" font-size="14" fill="#cbd5e1">(LLM-010) and never obeyed.</text>
      <rect x="805" y="236" width="355" height="140" rx="14" fill="#1e293b" stroke="#34d399"/><text x="829" y="272" font-size="18" font-weight="700" fill="#6ee7b7">ZERO DEPENDENCIES</text><text x="829" y="302" font-size="14" fill="#cbd5e1">Python standard library only.</text><text x="829" y="324" font-size="14" fill="#cbd5e1">No telemetry. Nothing is uploaded.</text><text x="829" y="346" font-size="14" fill="#cbd5e1">Works on a private repository.</text>
    </g>
  </g>
</svg>
