<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Architecture: app source goes through stack detection and 12 scanners into one findings file, then Claude reviews and the report, fix and verify steps follow">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="520" rx="20" fill="#0f172a"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="44" font-size="24" font-weight="800" fill="#f1f5f9" letter-spacing="1">ARCHITECTURE</text>
    <rect x="30" y="200" width="170" height="110" rx="14" fill="#1e293b" stroke="#475569"/>
    <text x="115" y="240" font-size="18" font-weight="700" fill="#f1f5f9">YOUR APP</text><text x="115" y="266" font-size="13" fill="#94a3b8">source, config,</text><text x="115" y="284" font-size="13" fill="#94a3b8">migrations, rules</text>
    <rect x="240" y="200" width="170" height="110" rx="14" fill="#1e293b" stroke="#2dd4bf"/>
    <text x="325" y="240" font-size="18" font-weight="700" fill="#f1f5f9">DETECT STACK</text><text x="325" y="266" font-size="13" fill="#94a3b8">framework, backend,</text><text x="325" y="284" font-size="13" fill="#94a3b8">builder, hosting</text>
    <rect x="460" y="76" width="320" height="358" rx="16" fill="#111c2f" stroke="#38bdf8"/>
    <text x="620" y="104" font-size="16" font-weight="700" fill="#7dd3fc" letter-spacing="1">12 READ-ONLY SCANNERS</text>
    <g font-size="13" fill="#e2e8f0">
      <rect x="480" y="120" width="135" height="34" rx="8" fill="#1e293b"/><text x="547" y="142">secrets · env</text>
      <rect x="625" y="120" width="135" height="34" rx="8" fill="#1e293b"/><text x="692" y="142">git history</text>
      <rect x="480" y="164" width="135" height="34" rx="8" fill="#1e293b"/><text x="547" y="186">supabase</text>
      <rect x="625" y="164" width="135" height="34" rx="8" fill="#1e293b"/><text x="692" y="186">firebase</text>
      <rect x="480" y="208" width="135" height="34" rx="8" fill="#1e293b"/><text x="547" y="230">routes · auth</text>
      <rect x="625" y="208" width="135" height="34" rx="8" fill="#1e293b"/><text x="692" y="230">payments</text>
      <rect x="480" y="252" width="135" height="34" rx="8" fill="#1e293b"/><text x="547" y="274">AI endpoints</text>
      <rect x="625" y="252" width="135" height="34" rx="8" fill="#1e293b"/><text x="692" y="274">frontend</text>
      <rect x="480" y="296" width="135" height="34" rx="8" fill="#1e293b"/><text x="547" y="318">config · headers</text>
      <rect x="625" y="296" width="135" height="34" rx="8" fill="#1e293b"/><text x="692" y="318">dependencies</text>
      <rect x="480" y="340" width="280" height="34" rx="8" fill="#1e293b"/><text x="620" y="362">launch polish · owner questions</text>
    </g>
    <text x="620" y="408" font-size="12" fill="#94a3b8">shared file cache · standard library only · no network</text>
    <rect x="830" y="150" width="170" height="110" rx="14" fill="#1e293b" stroke="#fbbf24"/>
    <text x="915" y="190" font-size="18" font-weight="700" fill="#f1f5f9">FINDINGS.JSON</text><text x="915" y="216" font-size="13" fill="#94a3b8">evidence, severity,</text><text x="915" y="234" font-size="13" fill="#94a3b8">confidence, fingerprint</text>
    <rect x="1030" y="90" width="150" height="100" rx="14" fill="#1e293b" stroke="#a78bfa"/>
    <text x="1105" y="128" font-size="17" font-weight="700" fill="#f1f5f9">CLAUDE REVIEW</text><text x="1105" y="154" font-size="13" fill="#94a3b8">logic, authz,</text><text x="1105" y="172" font-size="13" fill="#94a3b8">money flows</text>
    <rect x="1030" y="215" width="150" height="100" rx="14" fill="#1e293b" stroke="#fb7185"/>
    <text x="1105" y="253" font-size="17" font-weight="700" fill="#f1f5f9">REPORT + FIX</text><text x="1105" y="279" font-size="13" fill="#94a3b8">branch, one commit</text><text x="1105" y="297" font-size="13" fill="#94a3b8">per finding</text>
    <rect x="1030" y="340" width="150" height="100" rx="14" fill="#1e293b" stroke="#34d399"/>
    <text x="1105" y="378" font-size="17" font-weight="700" fill="#f1f5f9">VERIFY</text><text x="1105" y="404" font-size="13" fill="#94a3b8">re-run scanners,</text><text x="1105" y="422" font-size="13" fill="#94a3b8">before / after</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M202 255 H236"/><path d="M412 255 H456"/><path d="M782 205 H826"/><path d="M1002 190 L1026 150"/><path d="M1002 215 L1026 262"/><path d="M1105 316 V336"/></g>
  <text x="600" y="490" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#94a3b8">Scanners find candidates with evidence. Claude decides what is real. Fixes are re-checked by the same scanners.</text>
</svg>
