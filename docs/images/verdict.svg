<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="How the verdict is decided: any critical blocks, an unaccepted high blocks, medium means launch with caution, otherwise ready">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="460" rx="20" fill="#0f172a"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="44" font-size="24" font-weight="800" fill="#f1f5f9" letter-spacing="1">HOW THE VERDICT IS DECIDED</text>
    <g font-size="16" fill="#e2e8f0">
      <rect x="40" y="130" width="230" height="90" rx="14" fill="#1e293b" stroke="#475569"/><text x="155" y="168" font-weight="700">ANY OPEN CRITICAL?</text><text x="155" y="194" font-size="13" fill="#94a3b8">data, money or accounts</text>
      <rect x="340" y="130" width="230" height="90" rx="14" fill="#1e293b" stroke="#475569"/><text x="455" y="168" font-weight="700">OPEN HIGH, NOT ACCEPTED?</text><text x="455" y="194" font-size="13" fill="#94a3b8">accepted in writing</text>
      <rect x="640" y="130" width="230" height="90" rx="14" fill="#1e293b" stroke="#475569"/><text x="755" y="168" font-weight="700">ANY OPEN MEDIUM?</text><text x="755" y="194" font-size="13" fill="#94a3b8">weakens defence in depth</text>
    </g>
    <g font-size="14" fill="#94a3b8"><text x="305" y="120">NO</text><text x="605" y="120">NO</text><text x="172" y="256" fill="#fda4af" text-anchor="start">YES</text><text x="472" y="256" fill="#fda4af" text-anchor="start">YES</text><text x="772" y="256" fill="#fcd34d" text-anchor="start">YES</text><text x="965" y="120">NO</text></g>
    <rect x="40" y="280" width="230" height="80" rx="14" fill="#b42318"/><text x="155" y="330" font-size="26" font-weight="800" fill="#fff">BLOCKED</text>
    <rect x="340" y="280" width="230" height="80" rx="14" fill="#b42318"/><text x="455" y="330" font-size="26" font-weight="800" fill="#fff">BLOCKED</text>
    <rect x="640" y="280" width="230" height="80" rx="14" fill="#b54708"/><text x="755" y="322" font-size="20" font-weight="800" fill="#fff">LAUNCH WITH</text><text x="755" y="346" font-size="20" font-weight="800" fill="#fff">CAUTION</text>
    <rect x="940" y="130" width="220" height="90" rx="14" fill="#067647"/><text x="1050" y="186" font-size="28" font-weight="800" fill="#fff">READY</text>
    <text x="1050" y="250" font-size="13" fill="#94a3b8">always followed by the owner</text><text x="1050" y="268" font-size="13" fill="#94a3b8">actions that are still open</text>
    <text x="600" y="410" font-size="14" fill="#94a3b8">Severity adjustments (sensitive data, live app, compensating controls) are made by the reviewer and explained in the report.</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M272 175 H336"/><path d="M572 175 H636"/><path d="M872 175 H936"/><path d="M155 222 V276"/><path d="M455 222 V276"/><path d="M755 222 V276"/></g>
</svg>
