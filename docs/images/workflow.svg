<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="The seven phases: detect, scan, review, report, fix, verify, launch gate">
  <rect width="1200" height="360" rx="20" fill="#0f172a"/>
  <text x="600" y="48" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">From "does it work?" to "is it safe to launch?" in seven steps</text>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(30 90)"><rect width="150" height="190" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/><circle cx="75" cy="38" r="22" fill="#2dd4bf"/><text x="75" y="46" font-size="22" font-weight="800" fill="#0f172a">1</text><text x="75" y="92" font-size="20" font-weight="700" fill="#f1f5f9">Detect</text><text x="75" y="122" font-size="14" fill="#94a3b8">framework, backend,</text><text x="75" y="142" font-size="14" fill="#94a3b8">payments, AI, builder</text></g>
    <g transform="translate(200 90)"><rect width="150" height="190" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="75" cy="38" r="22" fill="#38bdf8"/><text x="75" y="46" font-size="22" font-weight="800" fill="#0f172a">2</text><text x="75" y="92" font-size="20" font-weight="700" fill="#f1f5f9">Scan</text><text x="75" y="122" font-size="14" fill="#94a3b8">12 read-only scripts,</text><text x="75" y="142" font-size="14" fill="#94a3b8">file + line evidence</text></g>
    <g transform="translate(370 90)"><rect width="150" height="190" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><circle cx="75" cy="38" r="22" fill="#a78bfa"/><text x="75" y="46" font-size="22" font-weight="800" fill="#0f172a">3</text><text x="75" y="92" font-size="20" font-weight="700" fill="#f1f5f9">Review</text><text x="75" y="122" font-size="14" fill="#94a3b8">Claude reads the logic</text><text x="75" y="142" font-size="14" fill="#94a3b8">scripts cannot judge</text></g>
    <g transform="translate(540 90)"><rect width="150" height="190" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><circle cx="75" cy="38" r="22" fill="#fbbf24"/><text x="75" y="46" font-size="22" font-weight="800" fill="#0f172a">4</text><text x="75" y="92" font-size="20" font-weight="700" fill="#f1f5f9">Report</text><text x="75" y="122" font-size="14" fill="#94a3b8">verdict first, plain</text><text x="75" y="142" font-size="14" fill="#94a3b8">words, 3 first actions</text></g>
    <g transform="translate(710 90)"><rect width="150" height="190" rx="14" fill="#1e293b" stroke="#fb7185" stroke-width="2"/><circle cx="75" cy="38" r="22" fill="#fb7185"/><text x="75" y="46" font-size="22" font-weight="800" fill="#0f172a">5</text><text x="75" y="92" font-size="20" font-weight="700" fill="#f1f5f9">Fix</text><text x="75" y="122" font-size="14" fill="#94a3b8">own branch, one commit</text><text x="75" y="142" font-size="14" fill="#94a3b8">per finding</text></g>
    <g transform="translate(880 90)"><rect width="150" height="190" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/><circle cx="75" cy="38" r="22" fill="#34d399"/><text x="75" y="46" font-size="22" font-weight="800" fill="#0f172a">6</text><text x="75" y="92" font-size="20" font-weight="700" fill="#f1f5f9">Verify</text><text x="75" y="122" font-size="14" fill="#94a3b8">re-run scanners,</text><text x="75" y="142" font-size="14" fill="#94a3b8">before / after table</text></g>
    <g transform="translate(1050 90)"><rect width="130" height="190" rx="14" fill="#1e293b" stroke="#f472b6" stroke-width="2"/><circle cx="65" cy="38" r="22" fill="#f472b6"/><text x="65" y="46" font-size="22" font-weight="800" fill="#0f172a">7</text><text x="65" y="92" font-size="20" font-weight="700" fill="#f1f5f9">Gate</text><text x="65" y="122" font-size="14" fill="#94a3b8">launch checklist,</text><text x="65" y="142" font-size="14" fill="#94a3b8">owner actions</text></g>
  </g>
  <g stroke="#475569" stroke-width="3" fill="none"><path d="M182 185 H198"/><path d="M352 185 H368"/><path d="M522 185 H538"/><path d="M692 185 H708"/><path d="M862 185 H878"/><path d="M1032 185 H1048"/></g>
  <text x="600" y="330" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" fill="#94a3b8">Nothing is uploaded. Nothing irreversible happens without your approval.</text>
</svg>
