server {
    listen 80;
    server_name app.acme.example;
    root /var/www/html;
    index index.php;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
    }
}
