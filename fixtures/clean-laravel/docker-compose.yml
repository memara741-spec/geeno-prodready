services:
  app:
    build: .
    depends_on:
      - db
      - redis
  web:
    image: nginx:1.27
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  worker:
    build: .
    command: php artisan queue:work --tries=3
    restart: always
  scheduler:
    build: .
    command: php artisan schedule:work
    restart: always
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: acme
    ports:
      - "127.0.0.1:3306:3306"
  redis:
    image: redis:7
